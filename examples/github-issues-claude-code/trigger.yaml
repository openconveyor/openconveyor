# GitHub Issues → implementer Task.
#
# The trigger starts a Task on issues.labeled events where the label is
# `conveyor:ready`, so a human still gates dispatch with a label. The
# implementer reads the issue (title, body, labels, comments) itself with gh
# from config.ISSUE_NUMBER. The prompt is the issue URL, a fallback only.
#
# dedupe: while a Task for the same issue is active, another label event
# creates nothing (ADR-0009). A terminal Task never blocks a new run.
apiVersion: openconveyor.ai/v1alpha1
kind: ClusterTriggerClass
metadata:
  name: github-issues-implementer
spec:
  path: /github/issues
  dedupe:
    uniqueBy:
      - openconveyor.ai/issue-number
  signature:
    header: X-Hub-Signature-256
    algorithm: sha256
    prefix: "sha256="
    secretRef:
      name: github-webhook
      key: secret
  filters:
    - path: action
      equals: labeled
    - path: label.name
      equals: "conveyor:ready"
  task:
    namespace: conveyor-tasks
    generateNamePrefix: gh-issue-
    agent:
      ref: claude-code-implementer
    permissions:
      secrets:
        - github-token
      egress:
        - api.github.com
        - github.com
    # The controller deletes the Task a day after it finishes, so
    # webhook-driven Tasks do not accumulate (Task GC, same semantics as
    # the Job field).
    ttlSecondsAfterFinished: 86400
    resources:
      cpu: "1"
      memory: 1Gi
      timeout: 30m
    mappings:
      - from: issue.html_url
        to: prompt
        default: "See issue — no URL supplied"
      # The controller projects config.* values into the agent container as
      # env vars. $TARGET_REPO and $TARGET_BRANCH make the implementer clone
      # the repo and open a PR. $ISSUE_NUMBER selects the issue that the
      # implementer reads and closes with the PR.
      - from: issue.number
        to: config.ISSUE_NUMBER
      - from: repository.clone_url
        to: config.TARGET_REPO
      - from: repository.default_branch
        to: config.TARGET_BRANCH
        default: main
      - from: repository.full_name
        to: annotations.openconveyor.ai/repo
      - from: issue.number
        to: labels.openconveyor.ai/issue-number
      - from: sender.login
        to: annotations.openconveyor.ai/requested-by
        default: unknown
