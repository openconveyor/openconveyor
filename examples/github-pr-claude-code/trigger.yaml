# GitHub Pull Requests → reviewer Task.
#
# The trigger starts a Task on pull_request.labeled events where the label is
# `conveyor:review`, so a human still gates dispatch with a label. The mapping
# copies the PR's html_url into the prompt. The reviewer agent extracts it and
# calls `gh pr diff` + `gh pr review --comment`.
#
# Note: you cannot template per-PR review instructions today (a mapping copies
# a single payload field). If you need a custom rubric per PR, put it in the
# PR body. Then switch the prompt mapping to pull_request.body. The reviewer
# agent extracts the PR URL from the prompt in both cases.
apiVersion: openconveyor.ai/v1alpha1
kind: ClusterTriggerClass
metadata:
  name: github-pr-reviewer
spec:
  path: /github/pull-request
  signature:
    header: X-Hub-Signature-256
    algorithm: sha256
    prefix: "sha256="
    secretRef:
      name: github-webhook
      key: secret
  filters:
    - path: action
      equals: labeled
    - path: label.name
      equals: "conveyor:review"
  task:
    namespace: conveyor-tasks
    generateNamePrefix: gh-pr-
    agent:
      ref: claude-code-reviewer
    permissions:
      secrets:
        - github-token
      egress:
        - api.github.com
        - github.com
    # The controller deletes the Task a day after it finishes, so
    # webhook-driven Tasks do not accumulate (Task GC, same semantics as
    # the Job field).
    ttlSecondsAfterFinished: 86400
    resources:
      cpu: "1"
      memory: 1Gi
      timeout: 15m
    mappings:
      # The PR URL is the required input. The agent's entrypoint extracts it
      # from the prompt with a regex and passes it to `gh pr diff` and
      # `gh pr review`. The default keeps the Task valid if html_url is
      # missing. The agent then exits with a clear error.
      - from: pull_request.html_url
        to: prompt
        default: "No pull_request.html_url in payload — cannot review"
      - from: repository.full_name
        to: annotations.openconveyor.ai/repo
      - from: pull_request.number
        to: labels.openconveyor.ai/pr-number
      - from: sender.login
        to: annotations.openconveyor.ai/requested-by
        default: unknown
