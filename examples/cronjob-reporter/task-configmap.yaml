# ConfigMap that holds the Task YAML that the CronJob applies on each tick.
# Edit the prompt and the agent.config values to match your project. The
# controller projects TARGET_REPO and REPORT_ISSUE_URL into the agent as
# env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reporter-task-template
  namespace: conveyor-tasks
  labels:
    app.kubernetes.io/name: conveyor
    app.kubernetes.io/component: cronjob-reporter
data:
  task.yaml: |
    apiVersion: openconveyor.ai/v1alpha1
    kind: Task
    metadata:
      generateName: report-
      namespace: conveyor-tasks
      labels:
        openconveyor.ai/trigger: cronjob
    spec:
      agent:
        ref: claude-code-reporter
        config:
          TARGET_REPO: your-org/your-repo
          REPORT_ISSUE_URL: https://github.com/your-org/your-repo/issues/1
      prompt:
        inline: |
          Summarize the PRs merged and issues opened in the past week.
          Highlight anything that looks like a breaking change or a
          security-relevant fix. Keep it concise (under 500 words).
      permissions:
        secrets:
          - github-token
        egress:
          - api.github.com
          - api.anthropic.com
      # The controller deletes the Task a day after it finishes, so
      # webhook-driven Tasks do not accumulate (Task GC, same semantics as
      # the Job field).
      ttlSecondsAfterFinished: 86400
      resources:
        cpu: "500m"
        memory: 512Mi
        timeout: 10m
