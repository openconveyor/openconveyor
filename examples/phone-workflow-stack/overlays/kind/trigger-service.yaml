# Exposes the trigger adapter of the manager on node port 30090.
apiVersion: v1
kind: Service
metadata:
  name: conveyor-trigger
  namespace: conveyor-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: conveyor
    control-plane: controller-manager
  ports:
    - name: trigger
      port: 9090
      targetPort: trigger
      nodePort: 30090
      protocol: TCP
