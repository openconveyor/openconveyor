# One secretGenerator for each Secret, each from one file in this
# directory. The files are gitignored; scripts/check-secrets.sh checks them.
# Separate generators keep each value in the one Secret and namespace that
# needs it. The names are fixed (no hash suffix), because ClusterAgentClass,
# Task and ClusterTriggerClass objects refer to them by name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # The model API key. The agent classes require it in every Task.
  - name: anthropic-api-key
    namespace: conveyor-tasks
    files:
      - api-key=anthropic-api-key
  # The fine-grained PAT for the target repository. The Tasks of the three
  # trigger classes declare it.
  - name: github-token
    namespace: conveyor-tasks
    files:
      - token=github-token
  # The HMAC key of the GitHub webhooks. It is in the namespace of the trigger
  # adapter (ADR-0006), never in the namespace of the Tasks.
  - name: github-webhook
    namespace: conveyor-system
    files:
      - secret=github-webhook-secret
