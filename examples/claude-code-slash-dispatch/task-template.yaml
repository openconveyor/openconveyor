# Standalone Task template for the "my laptop is a trigger" flow.
# Replace $PROMPT, then apply this file with `kubectl apply -f task-template.yaml`.
# As an alternative, use the matching `/conveyor` Claude Code slash command in
# `commands/conveyor.md`.
apiVersion: openconveyor.ai/v1alpha1
kind: Task
metadata:
  generateName: cc-dispatch-
  namespace: conveyor-tasks
spec:
  agent:
    ref: claude-code-implementer
  prompt:
    inline: |
      $PROMPT
  permissions:
    secrets:
      - github-token
    egress:
      - api.github.com
      - github.com
  # The controller deletes the Task a day after it finishes, so
  # webhook-driven Tasks do not accumulate (Task GC, same semantics as
  # the Job field).
  ttlSecondsAfterFinished: 86400
  resources:
    cpu: "1"
    memory: 1Gi
    timeout: 30m
