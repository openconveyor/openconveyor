# The positive e2e scenario (#39): a Task with no permissions on a busybox
# agent that reads its prompt and exits 0. It comes from the manual kind
# smoke test in #57. test/e2e/task_test.go applies and deletes it; the
# suite creates the namespace.
apiVersion: openconveyor.ai/v1alpha1
kind: ClusterAgentClass
metadata:
  name: e2e-busybox
spec:
  image: busybox:1.36
  imagePullPolicy: IfNotPresent
  command: ["sh", "-c"]
  args: ["cat /task/prompt && sleep 3"]
  inputs:
    prompt:
      mount: /task/prompt
---
apiVersion: openconveyor.ai/v1alpha1
kind: Task
metadata:
  name: e2e-completes
  namespace: e2e-tasks
spec:
  agent:
    ref: e2e-busybox
  prompt:
    inline: hello from the e2e suite
  # Task GC (#21): the controller deletes the Task one minute after it finishes.
  ttlSecondsAfterFinished: 60
  resources:
    cpu: 100m
    memory: 64Mi
    timeout: 2m
