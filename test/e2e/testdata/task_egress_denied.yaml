# The negative e2e scenario (#39): a Task with no egress whose agent tries
# an outbound connection. The deny-all NetworkPolicy drops the connection,
# and DNS as well. wget exits non-zero, and the Task must end Failed or
# TimedOut. test/e2e/task_test.go applies and deletes it.
#
# The agent sleeps first because kind's CNI (kindnet with
# kube-network-policies) only starts to filter a pod's traffic after it
# has indexed the pod IP, about one second after the container starts. The
# CNI accepts a connection that opens inside that window for its lifetime.
# The controller cannot close that window, because the NetworkPolicy
# already exists before the Job does. The sleep keeps the spec from a race
# with the CNI. See docs/security-model.md.
apiVersion: openconveyor.ai/v1alpha1
kind: ClusterAgentClass
metadata:
  name: e2e-busybox-wget
spec:
  image: busybox:1.36
  imagePullPolicy: IfNotPresent
  command: ["sh", "-c"]
  args: ["sleep 5 && wget -T 5 -q -O- https://example.com"]
---
apiVersion: openconveyor.ai/v1alpha1
kind: Task
metadata:
  name: e2e-egress-denied
  namespace: e2e-tasks
spec:
  agent:
    ref: e2e-busybox-wget
  prompt:
    inline: unused
  resources:
    cpu: 100m
    memory: 64Mi
    timeout: 2m
