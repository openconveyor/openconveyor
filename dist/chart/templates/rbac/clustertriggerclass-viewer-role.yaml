{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "conveyor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "conveyor.resourceName" (dict "suffix" "clustertriggerclass-viewer-role" "context" $) }}
rules:
- apiGroups:
  - openconveyor.ai
  resources:
  - clustertriggerclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - openconveyor.ai
  resources:
  - clustertriggerclasses/status
  verbs:
  - get
{{- end }}
