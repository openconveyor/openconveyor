{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clusteragentclasses.openconveyor.ai
spec:
  group: openconveyor.ai
  names:
    kind: ClusterAgentClass
    listKind: ClusterAgentClassList
    plural: clusteragentclasses
    singular: clusteragentclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterAgentClass is the Schema for the clusteragentclasses API. The
          controller reads a ClusterAgentClass as configuration and does not
          reconcile it, so the type has no status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ClusterAgentClass
            properties:
              args:
                description: args overrides the image CMD.
                items:
                  type: string
                type: array
              command:
                description: command overrides the image ENTRYPOINT.
                items:
                  type: string
                type: array
              image:
                description: image is the OCI reference for the agent.
                minLength: 1
                type: string
              imagePullPolicy:
                default: IfNotPresent
                description: imagePullPolicy mirrors Pod.spec.containers[].imagePullPolicy.
                enum:
                - Always
                - Never
                - IfNotPresent
                type: string
              inputs:
                description: inputs describes how Task data reaches the agent container.
                properties:
                  config:
                    description: |-
                      config is the location at which the controller delivers
                      Task.spec.agent.config as JSON.
                    properties:
                      env:
                        description: |-
                          env is the environment variable name. Do not set env together with
                          mount. Use mount for secrets, because environment variables leak into
                          /proc.
                        type: string
                      mount:
                        description: |-
                          mount is an absolute filesystem path inside the container. Do not set
                          mount together with env.
                        type: string
                    type: object
                  prompt:
                    description: prompt is the location at which the controller delivers
                      Task.spec.prompt.
                    properties:
                      env:
                        description: |-
                          env is the environment variable name. Do not set env together with
                          mount. Use mount for secrets, because environment variables leak into
                          /proc.
                        type: string
                      mount:
                        description: |-
                          mount is an absolute filesystem path inside the container. Do not set
                          mount together with env.
                        type: string
                    type: object
                type: object
              requires:
                description: |-
                  requires declares the permissions that this agent always needs. The
                  controller adds them to Task.spec.permissions at reconcile time.
                properties:
                  egress:
                    description: |-
                      egress is the allowlist that the agent always needs, for example the LLM
                      endpoint. Entries are DNS names, IP addresses or CIDR blocks, as in
                      Task.spec.permissions.egress.
                    items:
                      maxLength: 253
                      type: string
                      x-kubernetes-validations:
                      - message: must be a DNS name, an IP address or a CIDR block
                        rule: isCIDR(self) || isIP(self) || self.matches('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?([.][A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*[.]?$')
                    maxItems: 256
                    type: array
                  secrets:
                    description: |-
                      secrets is the list of Secret names that the controller always mounts for
                      the agent.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - image
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
{{- end }}
