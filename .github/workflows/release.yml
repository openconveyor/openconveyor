name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege at the top; the jobs that push images or publish the
# release raise what they need (`packages: write`, `id-token: write` for
# keyless signing, `contents: write` for the GitHub Release).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # The release is gated on the same checks a PR gets. Each one is the
  # PR workflow itself, reused through workflow_call, so the gate cannot
  # drift from CI.
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  test-e2e:
    uses: ./.github/workflows/test-e2e.yml
  test-chart:
    uses: ./.github/workflows/test-chart.yml
  agent-images:
    uses: ./.github/workflows/build-agents.yml

  images:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [lint, test, test-e2e, test-chart, agent-images]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign: OIDC token for the Fulcio certificate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: conveyor
            context: .
            dockerfile: Dockerfile
          - image: agent-claude-implementer
            context: agents/claude-code-implementer
            dockerfile: agents/claude-code-implementer/Dockerfile
          - image: agent-claude-reviewer
            context: agents/claude-code-reviewer
            dockerfile: agents/claude-code-reviewer/Dockerfile
          - image: agent-claude-reporter
            context: agents/claude-code-reporter
            dockerfile: agents/claude-code-reporter/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Keyless: the signature is bound to this workflow's OIDC identity
      # (repo + workflow path + tag ref) and recorded in Rekor. Signing the
      # digest, not the tag, so a later retag cannot borrow the signature.
      # Verification recipe: docs/security-model.md#supply-chain.
      - name: Sign ${{ matrix.image }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build install.yaml
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/conveyor:${{ github.ref_name }}
        run: make build-installer IMG="$IMG"

      - name: Package & push Helm chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          helm package dist/chart --version "$VERSION" --app-version "$TAG" --destination dist/
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm push "dist/conveyor-${VERSION}.tgz" "oci://${{ env.REGISTRY }}/${{ env.OWNER }}/charts"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Strip the leading 'v' from vX.Y.Z to match the [X.Y.Z] heading.
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && /^## \[/    { exit }
            in_section                { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No matching CHANGELOG section for $version — release notes will be empty." >&2
            echo "See https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/install.yaml
            dist/conveyor-*.tgz
          fail_on_unmatched_files: true
