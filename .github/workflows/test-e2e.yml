name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
  # Reused as a release gate by release.yml.
  workflow_call:

# Keyed on this file's name, not github.workflow: when called from
# release.yml every gate would otherwise share one group and cancel
# the others.
concurrency:
  group: test-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.33.0

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Running Test e2e
        run: make test-e2e
