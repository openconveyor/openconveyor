name: Agent Images

# Builds the three reference agent images on every PR so a broken
# Dockerfile or an unpublished pinned version surfaces before a release
# tag, not after. Nothing is pushed; release.yml does that.

on:
  push:
    branches:
      - main
  pull_request:
  # Reused as a release gate by release.yml.
  workflow_call:

# Keyed on this file's name, not github.workflow: when called from
# release.yml every gate would otherwise share one group and cancel
# the others.
concurrency:
  group: agent-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.agent }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - claude-code-implementer
          - claude-code-reviewer
          - claude-code-reporter
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build ${{ matrix.agent }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: agents/${{ matrix.agent }}
          file: agents/${{ matrix.agent }}/Dockerfile
          push: false
          load: true
          tags: agent-${{ matrix.agent }}:pr

      - name: Smoke-test the pinned CLI
        run: docker run --rm --entrypoint claude agent-${{ matrix.agent }}:pr --version
