name: Agent Images

# Builds the three reference agent images on every PR so a broken
# Dockerfile or an unpublished pinned version surfaces before a release
# tag, not after. Nothing is pushed; release.yml does that.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.agent }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - claude-code-implementer
          - claude-code-reviewer
          - claude-code-reporter
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.agent }}
        uses: docker/build-push-action@v6
        with:
          context: agents/${{ matrix.agent }}
          file: agents/${{ matrix.agent }}/Dockerfile
          push: false
          load: true
          tags: agent-${{ matrix.agent }}:pr

      - name: Smoke-test the pinned CLI
        run: docker run --rm --entrypoint claude agent-${{ matrix.agent }}:pr --version
