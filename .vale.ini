# Vale configuration for the Simplified Technical English rules in
# docs/writing-style.md. The STE style is vendored under .vale/styles,
# so `vale sync` has nothing to fetch and lint runs offline.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = STE

# Go: Vale reads comments only. Hide the controller-gen markers and the
# compiler directives, which are not prose. The Apache license header
# cannot be ignored in code formats; expect one "is distributed" hit per
# file that carries the full header.
[*.go]
BasedOnStyles = STE
TokenIgnores = (\+kubebuilder:[^\n]*), (\+(optional|required|listType|listMapKey|mapType|structType)[^\n]*), (nolint:[^\n]*), (go:build[^\n]*)
