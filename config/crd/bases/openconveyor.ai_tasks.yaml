---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tasks.openconveyor.ai
spec:
  group: openconveyor.ai
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agent.ref
      name: Agent
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.startTime
      name: Started
      priority: 1
      type: date
    - jsonPath: .status.completionTime
      name: Completed
      priority: 1
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task is one requested run of an agent. The controller creates a
          ServiceAccount, a Role, a NetworkPolicy and a Job from this spec. The
          owner references remove them together with the Task.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Task
            properties:
              agent:
                description: agent selects the ClusterAgentClass that runs this Task.
                properties:
                  config:
                    description: |-
                      config is non-secret, agent-specific configuration as a JSON object.
                      The controller projects each top-level scalar field into the agent
                      container as an environment variable with the name of the field, for
                      example TARGET_REPO. When the ClusterAgentClass declares an inputs.config
                      mount path, an environment variable, or both, the controller also
                      delivers the full JSON there. Never put secrets here, because
                      environment variables leak into /proc. Use permissions.secrets for secrets.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  ref:
                    description: ref is the name of a ClusterAgentClass.
                    type: string
                required:
                - ref
                type: object
              permissions:
                description: |-
                  permissions declares the least-privilege requirements of the Task.
                  The default is zero egress, zero secrets and zero RBAC.
                properties:
                  egress:
                    description: |-
                      egress is the allowlist of DNS names, IP addresses or CIDR blocks that
                      the Task can reach. Without entries, the controller denies all egress.
                      The controller resolves the entries to NetworkPolicy egress rules at
                      reconcile time.
                    items:
                      maxLength: 253
                      type: string
                      x-kubernetes-validations:
                      - message: must be a DNS name, an IP address or a CIDR block
                        rule: isCIDR(self) || isIP(self) || self.matches('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?([.][A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*[.]?$')
                    maxItems: 256
                    type: array
                  egressPorts:
                    description: |-
                      egressPorts restricts every egress allowlist entry to these
                      destination ports (TCP and UDP). The default is [443]. It does not
                      apply to the DNS rule, which always uses port 53. Ports are a
                      separate field and not a ":port" suffix on the egress entries,
                      because IPv6 CIDRs contain colons.
                    items:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  rbac:
                    description: |-
                      rbac is the list of Kubernetes RBAC rules that the Task needs. When it
                      is empty, the Task has no ServiceAccount token and cannot call the
                      Kubernetes API.
                    items:
                      description: |-
                        RBACRule is a minimal Kubernetes RBAC policy rule. It mirrors
                        rbacv1.PolicyRule. The type is local, so that the Task CRD schema does not
                        embed rbac/v1 transitively.
                      properties:
                        apiGroups:
                          items:
                            type: string
                          minItems: 1
                          type: array
                        resourceNames:
                          items:
                            type: string
                          type: array
                        resources:
                          items:
                            type: string
                          minItems: 1
                          type: array
                        verbs:
                          items:
                            type: string
                          minItems: 1
                          type: array
                      required:
                      - apiGroups
                      - resources
                      - verbs
                      type: object
                    type: array
                  secrets:
                    description: |-
                      secrets is the list of Secret names (in the namespace of the Task) that
                      the controller projects as files at /run/secrets/<name>/<key>, one file
                      for each Secret key. The controller does not support injection through
                      environment variables by design, because environment variables leak
                      into /proc.
                    items:
                      type: string
                    type: array
                type: object
              prompt:
                description: prompt provides the prompt body. Set exactly one source.
                properties:
                  configMapRef:
                    description: |-
                      configMapRef names the ConfigMap key, in the namespace of the Task, from
                      which the controller reads the prompt.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the ConfigMap or its key must
                          be defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  inline:
                    description: |-
                      inline is the prompt body as a string. The limit is 256 KiB, so that the
                      owned ConfigMap through which the controller projects it stays under the
                      1 MiB limit. Use secretRef or configMapRef for a larger prompt.
                    maxLength: 262144
                    type: string
                  secretRef:
                    description: |-
                      secretRef names the Secret key, in the namespace of the Task, from which
                      the controller reads the prompt.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: exactly one of inline, secretRef or configMapRef must be
                    set
                  rule: '[has(self.inline) && self.inline.size() > 0, has(self.secretRef),
                    has(self.configMapRef)].filter(x, x).size() == 1'
              resources:
                description: resources bounds the CPU, the memory and the wall-clock
                  time.
                properties:
                  cpu:
                    description: cpu is the CPU request and limit, for example "500m"
                      or "1".
                    type: string
                    x-kubernetes-validations:
                    - message: must be a non-negative Kubernetes resource quantity,
                        e.g. '500m' or '1'
                      rule: isQuantity(self) && !quantity(self).isLessThan(quantity('0'))
                  memory:
                    description: memory is the memory request and limit, for example
                      "512Mi" or "1Gi".
                    type: string
                    x-kubernetes-validations:
                    - message: must be a non-negative Kubernetes resource quantity,
                        e.g. '512Mi' or '1Gi'
                      rule: isQuantity(self) && !quantity(self).isLessThan(quantity('0'))
                  timeout:
                    description: |-
                      timeout is mandatory. The controller rejects a Task without one.
                      The controller maps it to Job.spec.activeDeadlineSeconds.
                    type: string
                    x-kubernetes-validations:
                    - message: must be a valid duration greater than 0 (e.g. '30m')
                      rule: duration(self) > duration('0s')
                required:
                - timeout
                type: object
              ttlSecondsAfterFinished:
                description: |-
                  ttlSecondsAfterFinished is the number of seconds after which the
                  controller deletes a terminal Task (Completed, Failed or TimedOut).
                  Through ownership, Kubernetes then deletes everything that the Task
                  created. The semantics are the same as for the Job field of the same
                  name. When it is unset, the controller uses its --task-ttl-seconds
                  flag. When both are unset, the controller never deletes the Task
                  automatically.
                format: int32
                minimum: 0
                type: integer
            required:
            - agent
            - prompt
            - resources
            type: object
          status:
            description: status defines the observed state of Task
            properties:
              completionTime:
                description: |-
                  completionTime is the time at which the Job finished, with success or
                  with failure.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions report the reconciler state in the form that the Kubernetes
                  API conventions define.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobName:
                description: jobName is the name of the Job that this Task owns.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the most recent .metadata.generation that the
                  controller has reconciled. Consumers use it to detect a stale status
                  after a spec change.
                format: int64
                type: integer
              phase:
                description: phase is a coarse lifecycle marker.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                - TimedOut
                type: string
              startTime:
                description: startTime is the time at which the Job first started.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
