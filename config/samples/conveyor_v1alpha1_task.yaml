# Minimal Task that uses the implementer agent. The controller unions these
# permissions with ClusterAgentClass.spec.requires. You do not need to repeat
# api.anthropic.com or anthropic-api-key; they come from the AgentClass.
#
# The Task configures no repository (no TARGET_REPO in spec.agent.config).
# The implementer thus answers the prompt and exits without a clone, a commit
# or a PR. The quick start completes with only the two Secrets in place.
# examples/ shows the repo-driven flows.
apiVersion: openconveyor.ai/v1alpha1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: conveyor
    app.kubernetes.io/managed-by: kustomize
  name: task-sample
  namespace: conveyor-tasks
spec:
  agent:
    ref: claude-code-implementer
  prompt:
    inline: |
      You are running inside an OpenConveyor Task as a smoke test. In two
      sentences, say which tools you have available and confirm that no
      repository is checked out. Do not create or modify any files.
  permissions:
    secrets:
      - github-token
    egress:
      - api.github.com
      - github.com
  resources:
    cpu: "1"
    memory: 1Gi
    timeout: 30m
