# Reference ClusterAgentClass for the "implementer" archetype. The agent reads
# a prompt file, clones a repo, writes code, and opens a PR. The permissions
# are the minimum baseline that every implementer Task needs. The controller
# unions Task.spec.permissions with them at reconcile time.
apiVersion: openconveyor.ai/v1alpha1
kind: ClusterAgentClass
metadata:
  labels:
    app.kubernetes.io/name: conveyor
    app.kubernetes.io/managed-by: kustomize
  name: claude-code-implementer
spec:
  image: ghcr.io/openconveyor/agent-claude-implementer:v0.2.1
  imagePullPolicy: IfNotPresent
  inputs:
    # The agent's entrypoint reads /task/prompt to learn what to do.
    prompt:
      mount: /task/prompt
  requires:
    # Every implementer Task needs the model API and a git host. The Task
    # must still declare the specific git host that it targets. The
    # AgentClass does not force a single host, so the same image works for
    # GitHub, GitLab and Forgejo when conveyor-git ships (post-v0.1.0).
    egress:
      - api.anthropic.com
    secrets:
      - anthropic-api-key
