# Reference ClusterAgentClass for the "reviewer" archetype. The agent reads a
# prompt, fetches a PR diff, and posts a review comment. It never pushes code
# and never opens a PR. Scope the github-token Secret to PR read + comment
# only; see examples/github-pr-claude-code/README.md#security-notes.
apiVersion: openconveyor.ai/v1alpha1
kind: ClusterAgentClass
metadata:
  labels:
    app.kubernetes.io/name: conveyor
    app.kubernetes.io/managed-by: kustomize
  name: claude-code-reviewer
spec:
  image: ghcr.io/openconveyor/agent-claude-reviewer:v0.2.1
  imagePullPolicy: IfNotPresent
  inputs:
    # The agent's entrypoint reads /task/prompt to learn what to review and
    # which PR. The reference triggers map pull_request.html_url into the
    # prompt. The agent can thus extract the PR coordinates with no extra
    # configuration.
    prompt:
      mount: /task/prompt
  requires:
    # Every reviewer Task needs the model API. The git host is per-Task. The
    # AgentClass does not pin one, so the same image works for GitHub, GitLab
    # and Forgejo when conveyor-git ships (post-v0.1.0).
    egress:
      - api.anthropic.com
    secrets:
      - anthropic-api-key
